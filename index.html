<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>3D Modeling App</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            user-select: none;
            -webkit-user-select: none;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        }

        body, html {
            width: 100%;
            height: 100%;
            overflow: hidden;
            background-color: #121212;
            color: #ffffff;
            touch-action: none;
        }

        /* Главное меню */
        #main-menu {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: #181818;
            display: flex;
            flex-direction: column;
            z-index: 100;
        }

        .menu-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 20px 24px;
            background-color: #202020;
            border-bottom: 1px solid #2a2a2a;
        }

        .menu-header h1 {
            font-size: 22px;
            font-weight: 600;
        }

        .menu-dots-btn {
            background: none;
            border: none;
            color: #ffffff;
            font-size: 24px;
            cursor: pointer;
            padding: 4px 8px;
            border-radius: 50%;
        }

        .menu-dots-btn:active {
            background-color: rgba(255, 255, 255, 0.1);
        }

        .menu-content {
            padding: 24px;
            display: flex;
            flex-wrap: wrap;
            gap: 20px;
        }

        .create-card-wrapper {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 8px;
            cursor: pointer;
        }

        .create-card {
            width: 90px;
            height: 90px;
            background-color: #4CAF50;
            border-radius: 20px;
            display: flex;
            justify-content: center;
            align-items: center;
            box-shadow: 0 4px 12px rgba(76, 175, 80, 0.3);
            transition: transform 0.1s ease, background-color 0.2s ease;
        }

        .create-card:active {
            transform: scale(0.95);
            background-color: #43A047;
        }

        .create-card .plus-icon {
            font-size: 42px;
            color: #ffffff;
            font-weight: 300;
            line-height: 1;
        }

        .create-title {
            font-size: 14px;
            color: #cccccc;
            font-weight: 500;
        }

        /* 3D Редактор */
        #editor-container {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            display: none;
        }

        #webgl-canvas {
            width: 100%;
            height: 100%;
            display: block;
        }

        .editor-header {
            position: absolute;
            top: 16px;
            left: 16px;
            z-index: 10;
        }

        .back-btn {
            background-color: rgba(30, 30, 30, 0.85);
            color: white;
            border: 1px solid rgba(255, 255, 255, 0.2);
            padding: 10px 16px;
            border-radius: 12px;
            font-size: 14px;
            backdrop-filter: blur(8px);
            cursor: pointer;
        }

        .back-btn:active {
            background-color: rgba(50, 50, 50, 0.9);
        }

        /* Нижняя навигационная панель из 5 главных кнопок */
        .bottom-nav {
            position: absolute;
            bottom: 0;
            left: 0;
            width: 100%;
            height: 64px;
            background-color: rgba(24, 24, 24, 0.92);
            backdrop-filter: blur(12px);
            border-top: 1px solid rgba(255, 255, 255, 0.1);
            display: flex;
            justify-content: space-around;
            align-items: center;
            z-index: 20;
            padding-bottom: env(safe-area-inset-bottom);
        }

        .nav-item {
            flex: 1;
            height: 100%;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            background: none;
            border: none;
            color: #8e8e93;
            font-size: 11px;
            font-weight: 500;
            cursor: pointer;
            transition: color 0.15s ease;
        }

        .nav-item .nav-icon {
            font-size: 20px;
            margin-bottom: 2px;
            line-height: 1;
        }

        .nav-item.active {
            color: #2196F3;
        }

        .nav-item:active {
            opacity: 0.7;
        }

        /* Дополнительная панель из 9 кнопок режимов для 3D Объем */
        #volume-tools-panel {
            position: absolute;
            bottom: 0;
            left: 0;
            width: 100%;
            background-color: rgba(20, 20, 20, 0.95);
            backdrop-filter: blur(16px);
            border-top: 1px solid rgba(255, 255, 255, 0.15);
            z-index: 30;
            display: none;
            flex-direction: column;
            padding: 8px 12px calc(8px + env(safe-area-inset-bottom)) 12px;
            box-shadow: 0 -8px 24px rgba(0, 0, 0, 0.5);
        }

        .volume-panel-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding-bottom: 6px;
            margin-bottom: 6px;
            border-bottom: 1px solid rgba(255, 255, 255, 0.08);
        }

        .volume-panel-title {
            font-size: 12px;
            color: #8e8e93;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .close-volume-panel-btn {
            background: none;
            border: none;
            color: #8e8e93;
            font-size: 16px;
            cursor: pointer;
            padding: 2px 6px;
        }

        .volume-grid {
            display: grid;
            grid-template-columns: repeat(5, 1fr);
            gap: 6px;
        }

        .vol-btn {
            background-color: rgba(40, 40, 40, 0.7);
            border: 1px solid rgba(255, 255, 255, 0.08);
            border-radius: 10px;
            padding: 6px 2px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            color: #ffffff;
            cursor: pointer;
            transition: background-color 0.15s ease, transform 0.1s ease;
        }

        .vol-btn:active {
            background-color: rgba(70, 70, 70, 0.9);
            transform: scale(0.95);
        }

        .vol-btn svg {
            width: 24px;
            height: 24px;
            margin-bottom: 4px;
        }

        .vol-btn span {
            font-size: 9px;
            font-weight: 500;
            text-align: center;
            line-height: 1.1;
            word-break: break-word;
        }

        /* Позиционирование по сетке для 9 кнопок */
        .vol-btn[data-action="other"]          { grid-column: 1; grid-row: 2; }
        .vol-btn[data-action="split"]          { grid-column: 2; grid-row: 2; }
        .vol-btn[data-action="detail"]         { grid-column: 3; grid-row: 2; }
        .vol-btn[data-action="mirror"]         { grid-column: 2; grid-row: 1; }
        .vol-btn[data-action="smooth-normals"] { grid-column: 4; grid-row: 1; }
        .vol-btn[data-action="smooth"]         { grid-column: 4; grid-row: 2; }
        .vol-btn[data-action="clone"]          { grid-column: 5; grid-row: 2; }
        .vol-btn[data-action="join"]           { grid-column: 5; grid-row: 1; }
        .vol-btn[data-action="delete"]         { grid-column: 6; grid-row: 1 / span 2; } /* Урна справа от объединить */

        /* Корректировка сетки на 6 колонок для размещения кнопок */
        .volume-grid {
            grid-template-columns: repeat(6, 1fr);
        }
    </style>
    <!-- Three.js & OrbitControls -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
</head>
<body>

    <!-- Главное меню -->
    <div id="main-menu">
        <div class="menu-header">
            <h1>Мои модели</h1>
            <button class="menu-dots-btn" id="dots-btn">&#8226;&#8226;&#8226;</button>
        </div>
        
        <div class="menu-content">
            <div class="create-card-wrapper" id="open-editor-btn">
                <div class="create-card">
                    <span class="plus-icon">+</span>
                </div>
                <span class="create-title">Создать</span>
            </div>
        </div>
    </div>

    <!-- Область 3D редактора -->
    <div id="editor-container">
        <div class="editor-header">
            <button class="back-btn" id="back-to-menu-btn">← Меню</button>
        </div>
        
        <canvas id="webgl-canvas"></canvas>

        <!-- Нижняя панель с 5 главными кнопками -->
        <div class="bottom-nav" id="main-bottom-nav">
            <button class="nav-item active" data-mode="functions">
                <span class="nav-icon">⚙️</span>
                <span>Функции</span>
            </button>
            <button class="nav-item" data-mode="vertices">
                <span class="nav-icon">•</span>
                <span>Точки</span>
            </button>
            <button class="nav-item" data-mode="edges">
                <span class="nav-icon">/</span>
                <span>Рёбра</span>
            </button>
            <button class="nav-item" data-mode="faces">
                <span class="nav-icon">⬜</span>
                <span>2D Грани</span>
            </button>
            <button class="nav-item" data-mode="volume" id="volume-mode-btn">
                <span class="nav-icon">🧊</span>
                <span>3D Объем</span>
            </button>
        </div>

        <!-- Панель с 9 кнопками для 3D Объема -->
        <div id="volume-tools-panel">
            <div class="volume-panel-header">
                <span class="volume-panel-title">3D Объем — Инструменты</span>
                <button class="close-volume-panel-btn" id="close-volume-panel">✕</button>
            </div>
            <div class="volume-grid">

                <!-- 1. Прочее🔼 (Слева внизу) -->
                <button class="vol-btn" data-action="other">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <path d="M12 15l-5 5h10l-5-5z" fill="#ff4d4d" stroke="#ff4d4d"/>
                        <circle cx="6" cy="8" r="2" fill="#ffffff"/>
                        <circle cx="12" cy="8" r="2" fill="#ffffff"/>
                        <circle cx="18" cy="8" r="2" fill="#ffffff"/>
                    </svg>
                    <span>прочее🔼</span>
                </button>

                <!-- 2. Разделить (2 куба и красная линия разделения) -->
                <button class="vol-btn" data-action="split">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5">
                        <rect x="2" y="6" width="8" height="8" stroke="#ffffff" />
                        <rect x="14" y="10" width="8" height="8" stroke="#ffffff" />
                        <line x1="12" y1="2" x2="12" y2="22" stroke="#ff4d4d" stroke-width="2" stroke-dasharray="2 2" />
                    </svg>
                    <span>Разделить</span>
                </button>

                <!-- 3. Детализ. (Куб с красными линиями полигонов в середине) -->
                <button class="vol-btn" data-action="detail">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5">
                        <rect x="4" y="4" width="16" height="16" stroke="#ffffff" />
                        <line x1="12" y1="4" x2="12" y2="20" stroke="#ff4d4d" stroke-width="2" />
                        <line x1="4" y1="12" x2="20" y2="12" stroke="#ff4d4d" stroke-width="2" />
                    </svg>
                    <span>Детализ.</span>
                </button>

                <!-- 4. Отзеркал. (Бабочка из красных линий) -->
                <button class="vol-btn" data-action="mirror">
                    <svg viewBox="0 0 24 24" fill="none" stroke="#ff4d4d" stroke-width="2">
                        <path d="M12 4v16M12 12L4 6v12l8-6zM12 12l8-6v12l-8-6z" />
                    </svg>
                    <span>Отзеркал.</span>
                </button>

                <!-- 5. Сгладить Нормали (Острые и сглаженные полигоны) -->
                <button class="vol-btn" data-action="smooth-normals">
                    <svg viewBox="0 0 24 24" fill="none" stroke-width="1.5">
                        <path d="M3 16L8 6l5 10" stroke="#ffffff" />
                        <path d="M13 16c2-8 6-8 8 0" stroke="#ff4d4d" stroke-width="2" />
                    </svg>
                    <span>Сгладить Нормали</span>
                </button>

                <!-- 6. Сгладить (Сфера с полигонами) -->
                <button class="vol-btn" data-action="smooth">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5">
                        <circle cx="12" cy="12" r="9" stroke="#ffffff" />
                        <path d="M12 3c-4.97 0-9 4.03-9 9s4.03 9 9 9" stroke="#ff4d4d" />
                        <path d="M3 12h18M12 3v18" stroke="#ffffff" stroke-dasharray="2 2" />
                    </svg>
                    <span>Сгладить</span>
                </button>

                <!-- 7. Клон (Белый куб -> красная стрелка -> красный куб) -->
                <button class="vol-btn" data-action="clone">
                    <svg viewBox="0 0 24 24" fill="none" stroke-width="1.5">
                        <rect x="2" y="7" width="8" height="8" stroke="#ffffff" />
                        <path d="M11 11h3m-1-2l2 2-2 2" stroke="#ff4d4d" stroke-width="2" />
                        <rect x="15" y="7" width="7" height="8" stroke="#ff4d4d" stroke-width="1.5" />
                    </svg>
                    <span>Клон</span>
                </button>

                <!-- 8. Объедин. (Два куба рядом, начерченные красной линией) -->
                <button class="vol-btn" data-action="join">
                    <svg viewBox="0 0 24 24" fill="none" stroke="#ff4d4d" stroke-width="1.5">
                        <rect x="3" y="6" width="9" height="11" />
                        <rect x="10" y="6" width="9" height="11" />
                        <path d="M10 6v11" stroke="#ffffff" stroke-dasharray="2 2" />
                    </svg>
                    <span>Объедин.</span>
                </button>

                <!-- 9. Удалить (Урна справа) -->
                <button class="vol-btn" data-action="delete">
                    <svg viewBox="0 0 24 24" fill="none" stroke="#ff4d4d" stroke-width="2">
                        <path d="M3 6h18M19 6v14a2 2 0 01-2 2H7a2 2 0 01-2-2V6m3 0V4a2 2 0 012-2h4a2 2 0 012 2v2M10 11v6M14 11v6" />
                    </svg>
                    <span>Удалить</span>
                </button>

            </div>
        </div>
    </div>

    <script>
        // Элементы UI
        const mainMenu = document.getElementById('main-menu');
        const editorContainer = document.getElementById('editor-container');
        const openEditorBtn = document.getElementById('open-editor-btn');
        const backToMenuBtn = document.getElementById('back-to-menu-btn');
        const navButtons = document.querySelectorAll('.nav-item');

        const mainBottomNav = document.getElementById('main-bottom-nav');
        const volumeToolsPanel = document.getElementById('volume-tools-panel');
        const closeVolumePanelBtn = document.getElementById('close-volume-panel');
        const volumeActionButtons = document.querySelectorAll('.vol-btn');

        let scene, camera, renderer, controls;
        let is3DInitialized = false;
        let currentMode = 'functions';

        // Открытие и закрытие редактора
        openEditorBtn.addEventListener('click', () => {
            mainMenu.style.display = 'none';
            editorContainer.style.display = 'block';
            
            if (!is3DInitialized) {
                init3D();
                is3DInitialized = true;
            } else {
                onWindowResize();
            }
        });

        backToMenuBtn.addEventListener('click', () => {
            editorContainer.style.display = 'none';
            mainMenu.style.display = 'flex';
        });

        // Переключение режимов главной панели
        navButtons.forEach(btn => {
            btn.addEventListener('click', () => {
                navButtons.forEach(b => b.classList.remove('active'));
                btn.classList.add('active');
                currentMode = btn.getAttribute('data-mode');
                console.log("Текущий режим:", currentMode);

                // Если нажали на "3D Объем" — показываем панель из 9 кнопок вместо 5
                if (currentMode === 'volume') {
                    mainBottomNav.style.display = 'none';
                    volumeToolsPanel.style.display = 'flex';
                }
            });
        });

        // Закрытие панели 9 кнопок и возврат к основным 5
        closeVolumePanelBtn.addEventListener('click', () => {
            volumeToolsPanel.style.display = 'none';
            mainBottomNav.style.display = 'flex';
        });

        // Обработка кликов по 9 кнопкам объёма
        volumeActionButtons.forEach(btn => {
            btn.addEventListener('click', () => {
                const action = btn.getAttribute('data-action');
                console.log("Нажата кнопка объёма:", action);
            });
        });

        // Инициализация Three.js
        function init3D() {
            const canvas = document.getElementById('webgl-canvas');
            
            scene = new THREE.Scene();
            scene.background = new THREE.Color(0x1a1a1a);

            camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
            camera.position.set(3, 3, 5);

            renderer = new THREE.WebGLRenderer({ canvas: canvas, antialias: true });
            renderer.setSize(window.innerWidth, window.innerHeight);
            renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));

            controls = new THREE.OrbitControls(camera, renderer.domElement);
            controls.enableDamping = true;

            // Сетка и свет
            const gridHelper = new THREE.GridHelper(10, 10, 0x444444, 0x222222);
            scene.add(gridHelper);

            const ambientLight = new THREE.AmbientLight(0xffffff, 0.6);
            scene.add(ambientLight);

            const dirLight = new THREE.DirectionalLight(0xffffff, 0.8);
            dirLight.position.set(5, 10, 7);
            scene.add(dirLight);

            // Базовый куб
            const geometry = new THREE.BoxGeometry(1, 1, 1);
            const material = new THREE.MeshStandardMaterial({ color: 0x4CAF50, roughness: 0.3 });
            const cube = new THREE.Mesh(geometry, material);
            cube.position.y = 0.5;
            scene.add(cube);

            window.addEventListener('resize', onWindowResize);
            animate();
        }

        function onWindowResize() {
            if (!camera || !renderer) return;
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        }

        function animate() {
            requestAnimationFrame(animate);
            if (controls) controls.update();
            if (renderer && scene && camera) renderer.render(scene, camera);
        }
    </script>
</body>
</html>
