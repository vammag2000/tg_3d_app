<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>3D Modeling App</title>
    <style>
        :root {
            --btn-size: clamp(48px, 13vw, 64px);
            --btn-gap: 6px;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            user-select: none;
            -webkit-user-select: none;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        }

        body, html {
            width: 100%;
            height: 100%;
            overflow: hidden;
            background-color: #121212;
            color: #ffffff;
            touch-action: none;
        }

        /* ===================== Главное меню ===================== */
        #main-menu {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: #181818;
            display: flex;
            flex-direction: column;
            z-index: 100;
        }

        .menu-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: calc(20px + env(safe-area-inset-top)) 24px 20px 24px;
            background-color: #202020;
            border-bottom: 1px solid #2a2a2a;
        }

        .menu-header h1 {
            font-size: 22px;
            font-weight: 600;
        }

        .menu-dots-btn {
            background: none;
            border: none;
            color: #ffffff;
            font-size: 24px;
            cursor: pointer;
            padding: 4px 8px;
            border-radius: 50%;
        }

        .menu-content {
            padding: 24px;
            display: flex;
            flex-wrap: wrap;
            gap: 20px;
        }

        .create-card-wrapper {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 8px;
            cursor: pointer;
        }

        .create-card {
            width: 90px;
            height: 90px;
            background-color: #4CAF50;
            border-radius: 20px;
            display: flex;
            justify-content: center;
            align-items: center;
            box-shadow: 0 4px 12px rgba(76, 175, 80, 0.3);
        }

        .create-card:active {
            background-color: #43A047;
        }

        .create-card .plus-icon {
            font-size: 42px;
            color: #ffffff;
            font-weight: 300;
            line-height: 1;
        }

        .create-title {
            font-size: 14px;
            color: #cccccc;
            font-weight: 500;
        }

        /* ===================== 3D Редактор ===================== */
        #editor-container {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            display: none;
        }

        #webgl-canvas {
            width: 100%;
            height: 100%;
            display: block;
        }

        /* ===================== Левый блок (гамбургер + 7 кнопок) ===================== */
        .top-left-area {
            position: absolute;
            top: calc(12px + env(safe-area-inset-top));
            left: 12px;
            z-index: 40;
            display: flex;
            flex-direction: column;
            gap: 8px;
            align-items: flex-start;
        }

        /* Гамбургер */
        .hamburger-btn {
            width: var(--btn-size);
            height: var(--btn-size);
            background-color: rgba(30, 30, 30, 0.9);
            border: 1px solid rgba(255, 255, 255, 0.15);
            border-radius: 12px;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            gap: 4px;
            cursor: pointer;
            backdrop-filter: blur(8px);
            -webkit-backdrop-filter: blur(8px);
            transition: background-color 0.15s ease, border-color 0.15s ease;
            flex-shrink: 0;
        }

        .hamburger-btn .bar {
            width: 22px;
            height: 2px;
            background-color: #ffffff;
            border-radius: 2px;
        }

        .hamburger-btn.active {
            background-color: #2196F3;
            border-color: #2196F3;
        }

        /* Сетка 7 кнопок */
        .top-menu-grid {
            display: none;
            grid-template-columns: repeat(2, var(--btn-size));
            gap: var(--btn-gap);
        }

        .top-menu-grid.open {
            display: grid;
        }

        .top-menu-grid .modeling-btn      { grid-column: 1; grid-row: 1; }
        .top-menu-grid .sculpting-btn     { grid-column: 2; grid-row: 1; }
        .top-menu-grid .texture-paint-btn { grid-column: 1; grid-row: 2; }
        .top-menu-grid .vertex-paint-btn  { grid-column: 2; grid-row: 2; }
        .top-menu-grid .uv-editor-btn     { grid-column: 1; grid-row: 3; }
        .top-menu-grid .materials-btn     { grid-column: 2; grid-row: 3; }
        .top-menu-grid .lighting-btn      { grid-column: 1; grid-row: 4; }

        /* Квадратная кнопка верхнего меню */
        .top-menu-btn {
            width: var(--btn-size);
            height: var(--btn-size);
            background-color: rgba(30, 30, 30, 0.9);
            border: 1px solid rgba(255, 255, 255, 0.15);
            border-radius: 12px;
            color: #ffffff;
            font-size: 9px;
            font-weight: 500;
            line-height: 1.1;
            cursor: pointer;
            backdrop-filter: blur(8px);
            -webkit-backdrop-filter: blur(8px);
            display: flex;
            align-items: center;
            justify-content: center;
            text-align: center;
            padding: 4px;
            word-break: break-word;
            hyphens: auto;
        }

        .top-menu-btn:active {
            background-color: rgba(70, 70, 70, 0.95);
        }

        /* ===================== Правый блок (4 кнопки горизонтально) ===================== */
        .hamburger-panel {
            position: absolute;
            top: calc(12px + env(safe-area-inset-top));
            right: 12px;
            z-index: 40;
            display: none;
            flex-direction: row;
            gap: var(--btn-gap);
            align-items: flex-start;
        }

        .hamburger-panel.open {
            display: flex;
        }

        .hamburger-panel .panel-item {
            width: var(--btn-size);
            height: var(--btn-size);
            background-color: rgba(30, 30, 30, 0.95);
            border: 1px solid rgba(255, 255, 255, 0.15);
            border-radius: 12px;
            color: #ffffff;
            font-size: 9px;
            font-weight: 500;
            line-height: 1.1;
            cursor: pointer;
            backdrop-filter: blur(8px);
            -webkit-backdrop-filter: blur(8px);
            display: flex;
            align-items: center;
            justify-content: center;
            text-align: center;
            padding: 4px;
            word-break: break-word;
            hyphens: auto;
        }

        .hamburger-panel .panel-item:active {
            background-color: rgba(70, 70, 70, 0.95);
        }

        /* ===================== Нижняя навигация ===================== */
        .bottom-nav {
            position: absolute;
            bottom: 0;
            left: 0;
            width: 100%;
            height: calc(64px + env(safe-area-inset-bottom));
            background-color: rgba(24, 24, 24, 0.92);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border-top: 1px solid rgba(255, 255, 255, 0.1);
            display: flex;
            justify-content: space-around;
            align-items: center;
            z-index: 20;
            padding-bottom: env(safe-area-inset-bottom);
        }

        .nav-item {
            flex: 1;
            height: 100%;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            background: none;
            border: none;
            color: #8e8e93;
            font-size: 11px;
            font-weight: 500;
            cursor: pointer;
        }

        .nav-item .nav-icon {
            font-size: 20px;
            margin-bottom: 2px;
            line-height: 1;
        }

        .nav-item.active {
            color: #2196F3;
        }

        /* ===================== Панели инструментов ===================== */
        .tools-panel {
            position: absolute;
            bottom: 0;
            left: 0;
            width: 100%;
            background-color: rgba(20, 20, 20, 0.95);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border-top: 1px solid rgba(255, 255, 255, 0.15);
            z-index: 30;
            display: none;
            flex-direction: column;
            padding: 8px 12px calc(8px + env(safe-area-inset-bottom)) 12px;
            box-shadow: 0 -8px 24px rgba(0, 0, 0, 0.5);
        }

        .panel-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding-bottom: 6px;
            margin-bottom: 6px;
            border-bottom: 1px solid rgba(255, 255, 255, 0.08);
        }

        .panel-title {
            font-size: 12px;
            color: #8e8e93;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .close-panel-btn {
            background: none;
            border: none;
            color: #8e8e93;
            font-size: 16px;
            cursor: pointer;
            padding: 2px 6px;
        }

        .sub-btn {
            background-color: rgba(40, 40, 40, 0.7);
            border: 1px solid rgba(255, 255, 255, 0.08);
            border-radius: 10px;
            padding: 6px 2px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            color: #ffffff;
            cursor: pointer;
        }

        .sub-btn:active {
            background-color: rgba(70, 70, 70, 0.9);
        }

        .sub-btn svg {
            width: 24px;
            height: 24px;
            margin-bottom: 4px;
        }

        .sub-btn span {
            font-size: 9px;
            font-weight: 500;
            text-align: center;
            line-height: 1.1;
            word-break: break-word;
        }

        .volume-grid {
            display: grid;
            grid-template-columns: repeat(6, 1fr);
            gap: 6px;
        }

        .volume-grid .sub-btn[data-action="other"]          { grid-column: 1; grid-row: 2; }
        .volume-grid .sub-btn[data-action="split"]          { grid-column: 2; grid-row: 2; }
        .volume-grid .sub-btn[data-action="detail"]         { grid-column: 3; grid-row: 2; }
        .volume-grid .sub-btn[data-action="mirror"]         { grid-column: 2; grid-row: 1; }
        .volume-grid .sub-btn[data-action="smooth-normals"] { grid-column: 4; grid-row: 1; }
        .volume-grid .sub-btn[data-action="smooth"]         { grid-column: 4; grid-row: 2; }
        .volume-grid .sub-btn[data-action="clone"]          { grid-column: 5; grid-row: 2; }
        .volume-grid .sub-btn[data-action="join"]           { grid-column: 5; grid-row: 1; }
        .volume-grid .sub-btn[data-action="delete"]         { grid-column: 6; grid-row: 1 / span 2; }

        .faces-grid {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 6px;
        }

        .faces-grid .sub-btn[data-action="other-left"]  { grid-column: 1; grid-row: 2; }
        .faces-grid .sub-btn[data-action="clone"]       { grid-column: 1; grid-row: 1; }
        .faces-grid .sub-btn[data-action="select-part"] { grid-column: 2; grid-row: 1; }
        .faces-grid .sub-btn[data-action="draw-face"]   { grid-column: 2; grid-row: 2; }
        .faces-grid .sub-btn[data-action="extrude"]     { grid-column: 3; grid-row: 1; }
        .faces-grid .sub-btn[data-action="delete"]      { grid-column: 3; grid-row: 2; }
        .faces-grid .sub-btn[data-action="detach"]      { grid-column: 4; grid-row: 1; }
    </style>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
</head>
<body>

    <!-- ===================== Главное меню ===================== -->
    <div id="main-menu">
        <div class="menu-header">
            <h1>Мои модели</h1>
            <button class="menu-dots-btn" id="dots-btn">&#8226;&#8226;&#8226;</button>
        </div>

        <div class="menu-content">
            <div class="create-card-wrapper" id="open-editor-btn">
                <div class="create-card">
                    <span class="plus-icon">+</span>
                </div>
                <span class="create-title">Создать</span>
            </div>
        </div>
    </div>

    <!-- ===================== 3D редактор ===================== -->
    <div id="editor-container">

        <!-- Левый блок: гамбургер + 7 кнопок -->
        <div class="top-left-area">
            <button class="hamburger-btn" id="hamburger-btn" aria-label="Меню">
                <span class="bar"></span>
                <span class="bar"></span>
                <span class="bar"></span>
            </button>

            <div class="top-menu-grid" id="top-menu-grid">
                <button class="top-menu-btn modeling-btn"      data-top="modeling">Моделлинг</button>
                <button class="top-menu-btn sculpting-btn"     data-top="sculpting">Скульптинг</button>
                <button class="top-menu-btn texture-paint-btn" data-top="texture-paint">Рисование текстур</button>
                <button class="top-menu-btn vertex-paint-btn"  data-top="vertex-paint">Покраска Вершин</button>
                <button class="top-menu-btn uv-editor-btn"     data-top="uv-editor">UV Редактор</button>
                <button class="top-menu-btn materials-btn"     data-top="materials">Материалы</button>
                <button class="top-menu-btn lighting-btn"      data-top="lighting">Освещение</button>
            </div>
        </div>

        <!-- Правый блок: 4 кнопки в горизонтальный ряд -->
        <div class="hamburger-panel" id="hamburger-panel">
            <button class="panel-item" data-menu="file">Файл</button>
            <button class="panel-item" data-menu="interface">Интерфейс</button>
            <button class="panel-item" data-menu="community">Сообщество и обучение</button>
            <button class="panel-item" data-menu="settings">Настройки</button>
        </div>

        <canvas id="webgl-canvas"></canvas>

        <!-- Нижняя панель -->
        <div class="bottom-nav" id="main-bottom-nav">
            <button class="nav-item active" data-mode="functions">
                <span class="nav-icon">⚙️</span>
                <span>Функции</span>
            </button>
            <button class="nav-item" data-mode="vertices">
                <span class="nav-icon">•</span>
                <span>Точки</span>
            </button>
            <button class="nav-item" data-mode="edges">
                <span class="nav-icon">/</span>
                <span>Рёбра</span>
            </button>
            <button class="nav-item" data-mode="faces" id="faces-mode-btn">
                <span class="nav-icon">⬜</span>
                <span>2D Грани</span>
            </button>
            <button class="nav-item" data-mode="volume" id="volume-mode-btn">
                <span class="nav-icon">🧊</span>
                <span>3D Объем</span>
            </button>
        </div>

        <!-- Панель 3D Объем -->
        <div class="tools-panel" id="volume-tools-panel">
            <div class="panel-header">
                <span class="panel-title">3D Объем — Инструменты</span>
                <button class="close-panel-btn" id="close-volume-panel">✕</button>
            </div>
            <div class="volume-grid">
                <button class="sub-btn" data-action="other">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <path d="M12 15l-5 5h10l-5-5z" fill="#ff4d4d" stroke="#ff4d4d"/>
                        <circle cx="6" cy="8" r="2" fill="#ffffff"/>
                        <circle cx="12" cy="8" r="2" fill="#ffffff"/>
                        <circle cx="18" cy="8" r="2" fill="#ffffff"/>
                    </svg>
                    <span>прочее🔼</span>
                </button>
                <button class="sub-btn" data-action="split">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5">
                        <rect x="2" y="6" width="8" height="8" stroke="#ffffff" />
                        <rect x="14" y="10" width="8" height="8" stroke="#ffffff" />
                        <line x1="12" y1="2" x2="12" y2="22" stroke="#ff4d4d" stroke-width="2" stroke-dasharray="2 2" />
                    </svg>
                    <span>Разделить</span>
                </button>
                <button class="sub-btn" data-action="detail">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5">
                        <rect x="4" y="4" width="16" height="16" stroke="#ffffff" />
                        <line x1="12" y1="4" x2="12" y2="20" stroke="#ff4d4d" stroke-width="2" />
                        <line x1="4" y1="12" x2="20" y2="12" stroke="#ff4d4d" stroke-width="2" />
                    </svg>
                    <span>Детализ.</span>
                </button>
                <button class="sub-btn" data-action="mirror">
                    <svg viewBox="0 0 24 24" fill="none" stroke="#ff4d4d" stroke-width="2">
                        <path d="M12 4v16M12 12L4 6v12l8-6zM12 12l8-6v12l-8-6z" />
                    </svg>
                    <span>Отзеркал.</span>
                </button>
                <button class="sub-btn" data-action="smooth-normals">
                    <svg viewBox="0 0 24 24" fill="none" stroke-width="1.5">
                        <path d="M3 16L8 6l5 10" stroke="#ffffff" />
                        <path d="M13 16c2-8 6-8 8 0" stroke="#ff4d4d" stroke-width="2" />
                    </svg>
                    <span>Сгладить Нормали</span>
                </button>
                <button class="sub-btn" data-action="smooth">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5">
                        <circle cx="12" cy="12" r="9" stroke="#ffffff" />
                        <path d="M12 3c-4.97 0-9 4.03-9 9s4.03 9 9 9" stroke="#ff4d4d" />
                        <path d="M3 12h18M12 3v18" stroke="#ffffff" stroke-dasharray="2 2" />
                    </svg>
                    <span>Сгладить</span>
                </button>
                <button class="sub-btn" data-action="clone">
                    <svg viewBox="0 0 24 24" fill="none" stroke-width="1.5">
                        <rect x="2" y="7" width="8" height="8" stroke="#ffffff" />
                        <path d="M11 11h3m-1-2l2 2-2 2" stroke="#ff4d4d" stroke-width="2" />
                        <rect x="15" y="7" width="7" height="8" stroke="#ff4d4d" stroke-width="1.5" />
                    </svg>
                    <span>Клон</span>
                </button>
                <button class="sub-btn" data-action="join">
                    <svg viewBox="0 0 24 24" fill="none" stroke="#ff4d4d" stroke-width="1.5">
                        <rect x="3" y="6" width="9" height="11" />
                        <rect x="10" y="6" width="9" height="11" />
                        <path d="M10 6v11" stroke="#ffffff" stroke-dasharray="2 2" />
                    </svg>
                    <span>Объедин.</span>
                </button>
                <button class="sub-btn" data-action="delete">
                    <svg viewBox="0 0 24 24" fill="none" stroke="#ff4d4d" stroke-width="2">
                        <path d="M3 6h18M19 6v14a2 2 0 01-2 2H7a2 2 0 01-2-2V6m3 0V4a2 2 0 012-2h4a2 2 0 012 2v2M10 11v6M14 11v6" />
                    </svg>
                    <span>Удалить</span>
                </button>
            </div>
        </div>

        <!-- Панель 2D Грани -->
        <div class="tools-panel" id="faces-tools-panel">
            <div class="panel-header">
                <span class="panel-title">2D Грани — Инструменты</span>
                <button class="close-panel-btn" id="close-faces-panel">✕</button>
            </div>
            <div class="faces-grid">
                <button class="sub-btn" data-action="other-left">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <path d="M15 12l5-5v10l-5-5z" fill="#ff4d4d" stroke="#ff4d4d"/>
                        <circle cx="8" cy="6" r="2" fill="#ffffff"/>
                        <circle cx="8" cy="12" r="2" fill="#ffffff"/>
                        <circle cx="8" cy="18" r="2" fill="#ffffff"/>
                    </svg>
                    <span>Прочее ◀️</span>
                </button>
                <button class="sub-btn" data-action="clone">
                    <svg viewBox="0 0 24 24" fill="none" stroke-width="1.5">
                        <rect x="2" y="7" width="8" height="8" stroke="#ffffff" />
                        <path d="M11 11h3m-1-2l2 2-2 2" stroke="#ff4d4d" stroke-width="2" />
                        <rect x="15" y="7" width="7" height="8" stroke="#ff4d4d" stroke-width="1.5" />
                    </svg>
                    <span>Клон</span>
                </button>
                <button class="sub-btn" data-action="select-part">
                    <svg viewBox="0 0 24 24" fill="none" stroke-width="1.5">
                        <path d="M12 2L3 7v10l9 5 9-5V7l-9-5z" stroke="#ffffff" fill="none"/>
                        <path d="M12 2l9 5-9 5-9-5 9-5z" fill="#ff4d4d" stroke="#ff4d4d"/>
                        <path d="M12 12v10l9-5V7l-9 5z" fill="#ff4d4d" opacity="0.8"/>
                    </svg>
                    <span>Выделить Часть</span>
                </button>
                <button class="sub-btn" data-action="draw-face">
                    <svg viewBox="0 0 24 24" fill="none" stroke-width="1.5">
                        <rect x="4" y="4" width="16" height="16" stroke="#ffffff" stroke-dasharray="2 2" />
                        <circle cx="4" cy="4" r="1.5" fill="#ffffff" />
                        <circle cx="20" cy="4" r="1.5" fill="#ffffff" />
                        <circle cx="4" cy="20" r="1.5" fill="#ffffff" />
                        <circle cx="20" cy="20" r="1.5" fill="#ffffff" />
                        <path d="M14 7l3 3-7 7-3 1 1-3 7-7z" fill="#ff4d4d" stroke="#ff4d4d" stroke-width="1"/>
                    </svg>
                    <span>Нарисов Грань</span>
                </button>
                <button class="sub-btn" data-action="extrude">
                    <svg viewBox="0 0 24 24" fill="none" stroke-width="1.5">
                        <rect x="3" y="9" width="10" height="10" stroke="#ffffff" />
                        <path d="M13 9l4-4h4v4l-4 4" stroke="#ff4d4d" stroke-width="1.5" />
                        <rect x="11" y="3" width="8" height="8" fill="#ff4d4d" stroke="#ff4d4d" opacity="0.9" />
                    </svg>
                    <span>Выдавить</span>
                </button>
                <button class="sub-btn" data-action="delete">
                    <svg viewBox="0 0 24 24" fill="none" stroke="#ff4d4d" stroke-width="2">
                        <path d="M3 6h18M19 6v14a2 2 0 01-2 2H7a2 2 0 01-2-2V6m3 0V4a2 2 0 012-2h4a2 2 0 012 2v2M10 11v6M14 11v6" />
                    </svg>
                    <span>Удалить</span>
                </button>
                <button class="sub-btn" data-action="detach">
                    <svg viewBox="0 0 24 24" fill="none" stroke-width="1.5">
                        <path d="M2 6h7v12H2z" stroke="#ffffff" />
                        <path d="M15 6h7v12h-7z" stroke="#ff4d4d" stroke-width="1.5" />
                        <path d="M10 12h4m-1-2l2 2-2 2" stroke="#ff4d4d" stroke-width="2" />
                    </svg>
                    <span>Отсоединить</span>
                </button>
            </div>
        </div>
    </div>

    <script>
        const mainMenu = document.getElementById('main-menu');
        const editorContainer = document.getElementById('editor-container');
        const openEditorBtn = document.getElementById('open-editor-btn');
        const navButtons = document.querySelectorAll('.nav-item');

        const mainBottomNav = document.getElementById('main-bottom-nav');
        const volumeToolsPanel = document.getElementById('volume-tools-panel');
        const closeVolumePanelBtn = document.getElementById('close-volume-panel');
        const facesToolsPanel = document.getElementById('faces-tools-panel');
        const closeFacesPanelBtn = document.getElementById('close-faces-panel');
        const subActionButtons = document.querySelectorAll('.sub-btn');

        const hamburgerBtn = document.getElementById('hamburger-btn');
        const hamburgerPanel = document.getElementById('hamburger-panel');
        const topMenuGrid = document.getElementById('top-menu-grid');
        const hamburgerItems = document.querySelectorAll('.hamburger-panel .panel-item');
        const topMenuBtns = document.querySelectorAll('.top-menu-btn');

        let scene, camera, renderer, controls;
        let is3DInitialized = false;
        let currentMode = 'functions';

        // Открытие редактора
        openEditorBtn.addEventListener('click', () => {
            mainMenu.style.display = 'none';
            editorContainer.style.display = 'block';
            if (!is3DInitialized) {
                init3D();
                is3DInitialized = true;
            } else {
                onWindowResize();
            }
        });

        // Гамбургер открывает/закрывает обе группы
        function setMenuOpen(open) {
            if (open) {
                hamburgerPanel.classList.add('open');
                topMenuGrid.classList.add('open');
                hamburgerBtn.classList.add('active');
            } else {
                hamburgerPanel.classList.remove('open');
                topMenuGrid.classList.remove('open');
                hamburgerBtn.classList.remove('active');
            }
        }

        hamburgerBtn.addEventListener('click', (e) => {
            e.stopPropagation();
            setMenuOpen(!hamburgerPanel.classList.contains('open'));
        });

        // Клик вне меню — закрыть
        document.addEventListener('click', (e) => {
            if (
                !hamburgerPanel.contains(e.target) &&
                !topMenuGrid.contains(e.target) &&
                !hamburgerBtn.contains(e.target)
            ) {
                setMenuOpen(false);
            }
        });

        hamburgerItems.forEach(item => {
            item.addEventListener('click', () => {
                console.log('Меню:', item.getAttribute('data-menu'));
                setMenuOpen(false);
            });
        });

        topMenuBtns.forEach(btn => {
            btn.addEventListener('click', () => {
                console.log('Верхнее меню:', btn.getAttribute('data-top'));
                setMenuOpen(false);
            });
        });

        // Нижняя навигация
        navButtons.forEach(btn => {
            btn.addEventListener('click', () => {
                navButtons.forEach(b => b.classList.remove('active'));
                btn.classList.add('active');
                currentMode = btn.getAttribute('data-mode');

                if (currentMode === 'volume') {
                    mainBottomNav.style.display = 'none';
                    facesToolsPanel.style.display = 'none';
                    volumeToolsPanel.style.display = 'flex';
                } else if (currentMode === 'faces') {
                    mainBottomNav.style.display = 'none';
                    volumeToolsPanel.style.display = 'none';
                    facesToolsPanel.style.display = 'flex';
                }
            });
        });

        closeVolumePanelBtn.addEventListener('click', () => {
            volumeToolsPanel.style.display = 'none';
            mainBottomNav.style.display = 'flex';
            resetNav();
        });

        closeFacesPanelBtn.addEventListener('click', () => {
            facesToolsPanel.style.display = 'none';
            mainBottomNav.style.display = 'flex';
            resetNav();
        });

        function resetNav() {
            navButtons.forEach(b => b.classList.remove('active'));
            const f = document.querySelector('.nav-item[data-mode="functions"]');
            if (f) f.classList.add('active');
            currentMode = 'functions';
        }

        subActionButtons.forEach(btn => {
            btn.addEventListener('click', () => {
                console.log('Нажата подкнопка:', btn.getAttribute('data-action'));
            });
        });

        // Three.js
        function init3D() {
            const canvas = document.getElementById('webgl-canvas');

            scene = new THREE.Scene();
            scene.background = new THREE.Color(0x1a1a1a);

            camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
            camera.position.set(3, 3, 5);

            renderer = new THREE.WebGLRenderer({ canvas: canvas, antialias: true });
            renderer.setSize(window.innerWidth, window.innerHeight);
            renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));

            controls = new THREE.OrbitControls(camera, renderer.domElement);
            controls.enableDamping = true;
            controls.target.set(0, 0.5, 0);
            controls.update();

            const gridHelper = new THREE.GridHelper(10, 10, 0x444444, 0x222222);
            scene.add(gridHelper);

            scene.add(new THREE.AmbientLight(0xffffff, 0.6));

            const dirLight = new THREE.DirectionalLight(0xffffff, 0.8);
            dirLight.position.set(5, 10, 7);
            scene.add(dirLight);

            const geometry = new THREE.BoxGeometry(1, 1, 1);
            const material = new THREE.MeshStandardMaterial({ color: 0x4CAF50, roughness: 0.3 });
            const cube = new THREE.Mesh(geometry, material);
            cube.position.y = 0.5;
            scene.add(cube);

            window.addEventListener('resize', onWindowResize);
            animate();
        }

        function onWindowResize() {
            if (!camera || !renderer) return;
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        }

        function animate() {
            requestAnimationFrame(animate);
            if (controls) controls.update();
            if (renderer && scene && camera) renderer.render(scene, camera);
        }
    </script>
</body>
</html>
