<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>3D Modeling App</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            user-select: none;
            -webkit-user-select: none;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        }

        body, html {
            width: 100%;
            height: 100%;
            overflow: hidden;
            background-color: #121212;
            color: #ffffff;
        }

        /* Главное меню */
        #main-menu {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: #181818;
            display: flex;
            flex-direction: column;
            z-index: 100;
        }

        .menu-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 20px 24px;
            background-color: #202020;
            border-bottom: 1px solid #2a2a2a;
        }

        .menu-header h1 {
            font-size: 22px;
            font-weight: 600;
        }

        .menu-dots-btn {
            background: none;
            border: none;
            color: #ffffff;
            font-size: 24px;
            cursor: pointer;
            padding: 4px 8px;
            border-radius: 50%;
        }

        .menu-dots-btn:active {
            background-color: rgba(255, 255, 255, 0.1);
        }

        .menu-content {
            padding: 24px;
            display: flex;
            flex-wrap: wrap;
            gap: 20px;
        }

        .create-card-wrapper {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 8px;
            cursor: pointer;
        }

        .create-card {
            width: 90px;
            height: 90px;
            background-color: #4CAF50;
            border-radius: 20px;
            display: flex;
            justify-content: center;
            align-items: center;
            box-shadow: 0 4px 12px rgba(76, 175, 80, 0.3);
            transition: transform 0.1s ease, background-color 0.2s ease;
        }

        .create-card:active {
            transform: scale(0.95);
            background-color: #43A047;
        }

        .create-card .plus-icon {
            font-size: 42px;
            color: #ffffff;
            font-weight: 300;
            line-height: 1;
        }

        .create-title {
            font-size: 14px;
            color: #cccccc;
            font-weight: 500;
        }

        /* 3D Редактор */
        #editor-container {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            display: none;
        }

        #webgl-canvas {
            width: 100%;
            height: 100%;
            display: block;
        }

        .editor-ui {
            position: absolute;
            top: 16px;
            left: 16px;
            z-index: 10;
        }

        .back-btn {
            background-color: rgba(30, 30, 30, 0.85);
            color: white;
            border: 1px solid rgba(255, 255, 255, 0.2);
            padding: 10px 16px;
            border-radius: 12px;
            font-size: 14px;
            backdrop-filter: blur(8px);
            cursor: pointer;
        }

        .back-btn:active {
            background-color: rgba(50, 50, 50, 0.9);
        }
    </style>
    <!-- Three.js & OrbitControls -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
</head>
<body>

    <!-- Главное меню -->
    <div id="main-menu">
        <div class="menu-header">
            <h1>Мои модели</h1>
            <button class="menu-dots-btn" id="dots-btn">&#8226;&#8226;&#8226;</button>
        </div>
        
        <div class="menu-content">
            <div class="create-card-wrapper" id="open-editor-btn">
                <div class="create-card">
                    <span class="plus-icon">+</span>
                </div>
                <span class="create-title">Создать</span>
            </div>
        </div>
    </div>

    <!-- Область 3D редактора -->
    <div id="editor-container">
        <div class="editor-ui">
            <button class="back-btn" id="back-to-menu-btn">← Меню</button>
        </div>
        <canvas id="webgl-canvas"></canvas>
    </div>

    <script>
        // Переключение экранов
        const mainMenu = document.getElementById('main-menu');
        const editorContainer = document.getElementById('editor-container');
        const openEditorBtn = document.getElementById('open-editor-btn');
        const backToMenuBtn = document.getElementById('back-to-menu-btn');
        const dotsBtn = document.getElementById('dots-btn');

        let scene, camera, renderer, controls;
        let is3DInitialized = false;

        openEditorBtn.addEventListener('click', () => {
            mainMenu.style.display = 'none';
            editorContainer.style.display = 'block';
            
            if (!is3DInitialized) {
                init3D();
                is3DInitialized = true;
            }
        });

        backToMenuBtn.addEventListener('click', () => {
            editorContainer.style.display = 'none';
            mainMenu.style.display = 'flex';
        });

        dotsBtn.addEventListener('click', () => {
            // Кнопка трех точек (заготовка)
        });

        // Инициализация 3D Сцены
        function init3D() {
            const canvas = document.getElementById('webgl-canvas');
            
            scene = new THREE.Scene();
            scene.background = new THREE.Color(0x1e1e1e);

            camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
            camera.position.set(3, 3, 5);

            renderer = new THREE.WebGLRenderer({ canvas: canvas, antialias: true });
            renderer.setSize(window.innerWidth, window.innerHeight);
            renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));

            controls = new THREE.OrbitControls(camera, renderer.domElement);
            controls.enableDamping = true;

            // Сетка и свет
            const gridHelper = new THREE.GridHelper(10, 10, 0x444444, 0x222222);
            scene.add(gridHelper);

            const ambientLight = new THREE.AmbientLight(0xffffff, 0.6);
            scene.add(ambientLight);

            const dirLight = new THREE.DirectionalLight(0xffffff, 0.8);
            dirLight.position.set(5, 10, 7);
            scene.add(dirLight);

            // Базовый куб
            const geometry = new THREE.BoxGeometry(1, 1, 1);
            const material = new THREE.MeshStandardMaterial({ color: 0x4CAF50, roughness: 0.3 });
            const cube = new THREE.Mesh(geometry, material);
            cube.position.y = 0.5;
            scene.add(cube);

            window.addEventListener('resize', onWindowResize);

            animate();
        }

        function onWindowResize() {
            if (!camera || !renderer) return;
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        }

        function animate() {
            requestAnimationFrame(animate);
            if (controls) controls.update();
            if (renderer && scene && camera) renderer.render(scene, camera);
        }
    </script>
</body>
</html>
